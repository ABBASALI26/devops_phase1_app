name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies and Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest

  build-and-push:
    name: Build and Push to ECR
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPO:latest \
            .

      - name: Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPO: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPO:latest

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Test EC2 Connectivity
        run: |
          echo "Testing EC2 port 22..."
          timeout 10 bash -c '</dev/tcp/${{ secrets.EC2_HOST }}/22'

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Checking EC2 IAM role..."
            AWS_SHARED_CREDENTIALS_FILE=/dev/null aws sts get-caller-identity

            echo "Logging in to Amazon ECR..."
            AWS_SHARED_CREDENTIALS_FILE=/dev/null aws ecr get-login-password \
              --region us-east-1 \
              | docker login \
              --username AWS \
              --password-stdin \
              890968193149.dkr.ecr.us-east-1.amazonaws.com

            echo "Stopping old container..."
            docker stop app-runner || true
            docker rm app-runner || true

            echo "Pulling latest image..."
            docker pull \
              890968193149.dkr.ecr.us-east-1.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

            echo "Starting new container..."
            docker run -d \
              --name app-runner \
              --restart always \
              -p 8000:8000 \
              890968193149.dkr.ecr.us-east-1.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:latest

            echo "Waiting for application..."
            sleep 5

            echo "Container status:"
            docker ps

            echo "Testing application..."
            curl -f http://localhost:8000

            echo "Deployment successful!"
